[project]
name = "comprexx"
version = "0.2.0"
description = "ML Model Compression & Deployment Optimization Toolkit"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "CacheVector" },
]
keywords = ["machine-learning", "model-compression", "quantization", "pruning", "onnx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pydantic>=2.0",
    "typer>=0.9",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/cachevector/comprexx"
Repository = "https://github.com/cachevector/comprexx"
Issues = "https://github.com/cachevector/comprexx/issues"

[project.optional-dependencies]
onnx = ["onnx>=1.14", "onnxruntime>=1.15", "onnxscript>=0.6", "onnxsim>=0.4"]
viz = ["streamlit>=1.28", "plotly>=5.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1"]
all = ["comprexx[onnx,viz,dev]"]

[project.scripts]
comprexx = "comprexx.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
]
